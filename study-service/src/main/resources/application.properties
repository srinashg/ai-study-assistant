spring.application.name=ai-integration

spring.ai.model.chat=anthropic

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-4-5

# PostgreSQL (override these values with environment variables outside local development)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/study_assistant}
spring.datasource.username=${DB_USERNAME:study_app}
spring.datasource.password=${DB_PASSWORD:study_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only verifies that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
