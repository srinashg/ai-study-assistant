spring.application.name=ai-integration

spring.ai.model.chat=anthropic
spring.ai.model.embedding=ollama

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-4-5

# Local Ollama serves embeddings for RAG mode; pull the model first: `ollama pull nomic-embed-text`
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.init.pull-model-strategy=when_missing

# pgvector stores document chunk embeddings; it manages its own table outside of Flyway.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Uploaded source files for RAG mode
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# PostgreSQL (override these values with environment variables outside local development)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/study_assistant}
spring.datasource.username=${DB_USERNAME:study_app}
spring.datasource.password=${DB_PASSWORD:study_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only verifies that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
