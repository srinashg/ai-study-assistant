name: AI Study Assistant CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Build and test backend
        working-directory: study-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

  frontend:
    name: Next.js CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: study-ui
        run: npm ci

      - name: Lint
        working-directory: study-ui
        run: npm run lint

      - name: Type check
        working-directory: study-ui
        run: npm run typecheck

      - name: Build frontend
        working-directory: study-ui
        run: npm run build
